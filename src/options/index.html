<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clutch Collector settings</title>
  </head>
  <body>
    <h1>Clutch Collector · Settings</h1>
    <p>
      Use your Apps Script deployment URL and personal signing key. The key
      stays in browser session memory and must be entered again after restarting
      Chrome.
    </p>
    <form id="settings">
      <label
        >Apps Script Web App URL<input
          id="endpoint"
          required
          placeholder="https://script.google.com/macros/s/…/exec" /></label
      ><label
        >Session signing key<input
          id="secret"
          type="password"
          autocomplete="off"
          minlength="32"
          placeholder="Leave blank to keep the current session key" /></label
      ><button>Save configuration</button
      ><button id="test" type="button">Test Connection</button
      ><button id="reset" type="button">Reset local drafts and results</button
      ><button id="lock" type="button">Forget session key</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
