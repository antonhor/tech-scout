<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clutch Collector</title>
  </head>
  <body>
    <header>
      <h1>Clutch Collector</h1>
      <button id="settings">Settings</button>
    </header>
    <p id="url"></p>
    <p id="connection"></p>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="scan">Scan Company</button>
    <section id="preview" hidden>
      <h2>Review company</h2>
      <p id="warnings"></p>
      <details>
        <summary>Scan diagnostics</summary>
        <p>
          If fields are missing, copy this report to help fix the extractor.
        </p>
        <textarea
          id="diagnostics"
          aria-label="Scan diagnostics report"
          readonly
          rows="8"
        ></textarea>
      </details>
      <form id="company">
        <label
          >Company name<input name="name" required maxlength="5000" /></label
        ><label
          >Official website<input
            name="website"
            placeholder="https://example.com" /></label
        ><label>Clutch profile URL<input name="clutchUrl" required /></label
        ><label
          >Programming languages <small>Separate labels with commas</small
          ><input name="programmingLanguages" /></label
        ><label
          >Frameworks and technologies <small>Separate labels with commas</small
          ><input name="frameworksAndTechnologies" /></label
        ><label>Notes<textarea name="notes" maxlength="5000"></textarea></label>
      </form>
      <section id="duplicates" hidden>
        <h2>Possible duplicates</h2>
        <p>
          Select a record. Its merged values will appear in the editable form
          above. Clearing a field here explicitly clears it on update.
        </p>
        <select id="candidate" aria-label="Existing company"></select>
        <pre id="existing"></pre>
      </section>
      <footer>
        <button id="cancel">Cancel</button><button id="skip" hidden>Skip</button
        ><button id="save">Confirm saving</button>
      </footer>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
